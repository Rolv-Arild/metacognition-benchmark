[project]
name = "metacognition-benchmark"
version = "0.1.0"
description = "Benchmark measuring how well LLMs know what they know — calibration over accuracy."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mpmath~=1.3.0",
    "requests~=2.34.2",
    "transformers~=5.9.0",
    "torch~=2.12.0",
    "accelerate~=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.3",
    "ruff~=0.15.14",
]
api = [
    "openai~=2.38.0",
]
quantization = [
    "bitsandbytes~=0.49.2",
]


[project.scripts]
metacognition-benchmark = "metacognition_benchmark.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
